name: Build APK + signed AAB
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Debug APK (test ads)
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Signed release AAB (Play Store)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          gradle bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: release-aab-for-play-store
          path: app/build/outputs/bundle/release/app-release.aab
