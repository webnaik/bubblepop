<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Shooter - Pop Mania</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,var(--b1) 0%,var(--b2) 70%);color:#eef1ff;font-family:'Sora',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{--extra:0px;--ww:min(96vw,calc((100vh - 112px - var(--extra) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*0.642857),620px)}
body.adv{--extra:38px}
@supports(height:100dvh){body{--ww:min(96vw,calc((100dvh - 112px - var(--extra) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*0.642857),620px)}}
.hud,.wrap,#goal{flex:none}
.hud{display:flex;gap:8px;width:var(--ww);align-items:stretch}
.card{flex:1;background:#ffffff0d;border:1px solid #ffffff1c;border-radius:14px;padding:7px 12px;min-width:0}
.card small{display:block;font-size:11px;color:#98a6dc;font-weight:500}
.card b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.lv{flex:1.2}
.bar{height:4px;border-radius:2px;background:#ffffff1c;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3aa0ff,#a66bff);transition:width .4s}
.ctl{width:44px;display:flex;flex-direction:column;gap:6px}
.ctl button{flex:1;border-radius:12px;border:1px solid #ffffff1c;background:#ffffff0d;color:#c7d2ff;display:flex;align-items:center;justify-content:center;padding:0}
.ctl button:focus-visible{outline:2px solid #fff}
.wrap{position:relative;width:var(--ww);height:auto;aspect-ratio:360/560}
canvas{width:100%;height:100%;display:block;border-radius:22px;background:radial-gradient(circle,#ffffff0b 1px,transparent 1.6px) 0 0/18px 18px;border:1px solid #ffffff22;box-shadow:0 24px 60px -20px #000c,inset 0 1px 0 #ffffff18}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#060918bb;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:22px}
.panel{width:80%;text-align:center;padding:28px 22px;border-radius:20px;background:linear-gradient(#ffffff14,#ffffff08);border:1px solid #ffffff26}
.panel h2{margin:0 0 6px;font-size:28px;font-weight:700;letter-spacing:-.01em}
.panel .sub{margin:0 0 20px;color:#a9b6e8;font-size:14px;line-height:1.5}
.panel button{font:inherit;font-weight:600;font-size:16px;padding:13px 34px;border:0;border-radius:12px;color:#14102e;background:linear-gradient(#ffd56b,#ffb338);box-shadow:0 8px 20px -6px #ffb33899}
.panel button:active{transform:translateY(1px)}
.panel button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:18px}
.dots i{width:14px;height:14px;border-radius:50%}
.btns button{display:block;width:100%}.btns button+button{margin-top:10px;background:#ffffff14;color:#eef1ff;box-shadow:none;border:1px solid #ffffff2a}
:root{--c1:#1d2a62;--c2:#0d1331;--c3:#090d26;--b1:#141c47;--b2:#080b1f}
.panel{max-height:calc(100% - 20px);overflow:auto;animation:pin .28s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(10px) scale(.97)}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.btns.m,.btns.m2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns.m button,.btns.m2 button{margin:0}
.btns.m button:nth-child(-n+3),.btns.m2 button:nth-child(-n+2){grid-column:1/-1}
.btns.m button:nth-child(n+4),.btns.m2 button:nth-child(n+3){padding:10px;font-size:14px}
.btns.sm button{padding:9px 12px;font-size:14px;background:#ffffff14;color:#eef1ff;box-shadow:none;border:1px solid #ffffff2a;margin-top:8px}
.btns.sm button:last-child{background:linear-gradient(#ffd56b,#ffb338);color:#14102e;border:0;margin-top:14px}
.vol{display:flex;flex-direction:column;gap:6px;font-size:13px;margin-bottom:6px;text-align:left}
.vol input{width:100%;accent-color:#ffb338}
.tgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.tile{background:#ffffff0d;border:1px solid #ffffff18;border-radius:10px;padding:7px 2px}
.tile b{display:block;font-size:17px;color:#fff}
.tile span{font-size:10px}
.ach{text-align:left;margin-bottom:14px}
.ach div{display:flex;gap:10px;align-items:center;padding:6px 0;opacity:.45}
.ach div.on{opacity:1}
.ach i{width:18px;height:18px;border-radius:50%;border:1.5px solid #ffffff44;flex:none;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center;color:#14102e}
.ach .on i{background:#ffb338;border-color:#ffb338}
.ach span{font-size:12px;line-height:1.3}
.ach b{display:block;font-size:13px;color:#fff}
.stars{font-size:22px;color:#ffc94a;letter-spacing:4px}
#toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-14px);opacity:0;pointer-events:none;padding:8px 14px;border-radius:999px;background:#10163fdd;border:1px solid #ffffff30;font-size:13px;font-weight:600;transition:.3s;white-space:nowrap;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
#goal{display:none;align-items:center;justify-content:center;gap:8px;height:26px;padding:0 14px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff1c;font-size:12.5px;font-weight:600;max-width:var(--ww)}
.gd{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}

.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.lvgrid button{padding:8px 0;font-size:15px;border-radius:12px;background:#ffffff14;color:#fff;border:1px solid #ffffff2a;box-shadow:none;line-height:1.2;font-weight:700}
.lvgrid button small{display:block;font-size:9px;color:#ffc94a;font-weight:500;letter-spacing:1px}
.lvgrid button.done{border-color:#ffb338}
.lvgrid button:disabled{opacity:.3}
.panel svg{width:100%;height:auto;max-height:112px;display:block}
.tt{margin:12px 0;font-size:14px;line-height:1.55;color:#a9b6e8}
.tdots{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
.tdots i{width:7px;height:7px;border-radius:50%;background:#ffffff33;transition:.2s}
.tdots i.on{background:#ffb338;width:18px;border-radius:4px}
.pg{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;font-weight:600}
.pg button{padding:6px 16px;font-size:16px;border-radius:10px;background:#ffffff14;color:#fff;border:1px solid #ffffff2a;box-shadow:none}
.pg button:disabled{opacity:.3}
.lvgrid button.boss{border-color:#ff5d73;background:#ff5d7322}
.btns.mm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns.mm button{margin:0;padding:10px;font-size:14px}
.btns.mm button:first-child{grid-column:1/-1;padding:13px;font-size:16px}
.meta{display:flex;justify-content:center;gap:16px;font-weight:600;font-size:14px;margin-bottom:14px;color:#ffe9a0}
.coin{display:inline-block;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb938 60%,#b86f10);vertical-align:-2px;margin-right:4px}
.coinline{color:#ffd56b;font-weight:700;margin:6px 0 10px;font-size:15px}
.days{display:flex;justify-content:center;gap:6px;margin:6px 0 12px}
.days i{width:30px;height:30px;border-radius:50%;border:1.5px solid #ffffff33;font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.days i.on{background:#ffb338;border-color:#ffb338;color:#14102e}
.days i.cur{box-shadow:0 0 0 3px #ffb33855}
.mrow,.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #ffffff14;text-align:left}
.mt{flex:1;font-size:13px;line-height:1.3;color:#eef1ff}
.mb{height:4px;border-radius:2px;background:#ffffff1c;margin-top:5px;overflow:hidden}
.mb i{display:block;height:100%;background:linear-gradient(90deg,#3aa0ff,#a66bff)}
.pn{font-size:12px;color:#98a6dc}
.ok{font-size:12px;color:#7be8b0;font-weight:700}
.lk{font-size:11px;color:#98a6dc;text-align:right}
.mrow button,.srow button{padding:6px 12px;font-size:13px;border-radius:10px;box-shadow:none}
.srow b{flex:1;font-size:13px}
.srow button.no{opacity:.45}
.sw{width:34px;height:20px;border-radius:6px;flex:none;border:1px solid #ffffff33}
.sh{margin:12px 0 2px;font-size:12px;font-weight:700;color:#98a6dc;text-align:left}
.bi{flex:1;display:flex;flex-direction:column}
.bi b{flex:none;font-size:14px}
.bi small{font-size:11px;color:#98a6dc}
.chest{width:120px;margin:0 auto 8px;display:block;animation:cpop .5s}
.reward{font-size:20px;font-weight:700;color:#ffd56b;margin:8px 0 16px;animation:rw .6s}
@keyframes cpop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes rw{from{opacity:0;transform:translateY(8px)}}
.shimg{width:100%;border-radius:12px;display:block;margin-bottom:8px}
.close{color:#ffd56b;font-size:15px}
.lb{margin:10px 0 4px;text-align:left}
.lb div{display:flex;gap:10px;padding:4px 8px;font-size:13px;border-radius:8px}
.lb div.me{background:#ffb33833}
.lb b{width:18px}.lb span{flex:1;font-weight:700;color:#fff}.lb i{font-style:normal;color:#98a6dc}
#bgc{position:absolute;inset:0;width:100%;height:100%;border-radius:22px;display:block;border:none;box-shadow:none;background:#0d1331}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tcard{padding:6px;border-radius:12px;background:#ffffff0f;border:1px solid #ffffff22;color:#fff;box-shadow:none;font-size:12px;font-weight:600;text-align:center;line-height:1.3}
.tcard.eq{border-color:#ffb338}
.tcard img{width:100%;border-radius:8px;display:block;margin-bottom:5px}
.tcard small{display:block;color:#ffc94a;font-weight:500}
.thimg{width:62%;border-radius:12px;display:block;margin:0 auto 6px;border:1px solid #ffffff33}
#bgc{z-index:0;pointer-events:none}
#c{position:relative;z-index:1}
#ov{z-index:3}
</style>
</head>
<body>
<div class="hud">
  <div class="card lv"><small id="lt">Level</small><b id="lv">1</b><div class="bar"><i id="bar"></i></div></div>
  <div class="card"><small id="ls">Score</small><b id="sc">0</b></div>
  <div class="card"><small id="lb">Best</small><b id="bs">0</b></div>
  <div class="ctl"><button id="mute" aria-label="Sound on"></button><button id="pz" aria-label="Pause"></button></div>
</div>
<div id="goal"></div>
<div class="wrap">
  <canvas id="bgc" width="360" height="560"></canvas>
  <canvas id="c" width="360" height="560"></canvas>
  <div id="toast"></div>
  <div id="ov"><div class="panel">
    <div class="dots" id="dots"></div>
    <h2 id="ot">Bubble Shooter - Pop Mania</h2>
    <div id="os" class="sub"></div>
    <div class="btns" id="bt"></div>
  </div></div>
</div>
<script>
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const W=360,H=560,R=18,D=36,RH=31.18,COLS=10,LOSE=12,SY=H-52,ROWS=16;
const DPR=Math.min(3,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.scale(DPR,DPR);
const COL=[
 {b:'#ff5d73',l:'#ffa3b0',d:'#c4304a'},
 {b:'#ffb938',l:'#ffe39a',d:'#c47a12'},
 {b:'#2ee6a6',l:'#9af7d6',d:'#12a070'},
 {b:'#3aa0ff',l:'#98d2ff',d:'#1a63c2'},
 {b:'#a66bff',l:'#d3b0ff',d:'#6a38c4'},
 {b:'#7b8296',l:'#b9bfd0',d:'#4a5063'},
 {b:'#ffd93d',l:'#fff3a0',d:'#c79a00'},
 {b:'#7bd23a',l:'#c5f58f',d:'#3f8f12'},
 {b:'#4a5078',l:'#8f98c8',d:'#1b1f3a'}];
document.getElementById('dots').innerHTML=COL.slice(0,5).map(c=>`<i style="background:radial-gradient(circle at 35% 30%,${c.l},${c.b} 55%,${c.d})"></i>`).join('');
let thunders=[];
let grid,off,score,best=0,cur,nxt,ang=-Math.PI/2,shot,shots,over=true,fall=[],pops=[],parts=[],texts=[],ignore=false;
let level=1,combo=0,banner=null,shake=0,muted=false,AC=null,daily=false,dkey='',dbest=0,rng=Math.random,pw={rainbow:1,bird:2,thunder:1},armed=null,paused=false,T=0,trail=[];
const PZ='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
try{best=+localStorage.getItem('bb')||0;muted=localStorage.getItem('bbm')==='1'}catch(e){}
const SPK='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const MUT='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/></svg>';
function setMute(){const m=document.getElementById('mute');m.innerHTML=muted?MUT:SPK;m.setAttribute('aria-label',muted?'Sound off':'Sound on')}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.15,to=0,delay=0){
  if(muted)return;const a=ac();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);
}
const SFX={
  shoot:()=>tone(520,.12,'triangle',.14,180),
  stick:()=>tone(150,.1,'sine',.2,60),
  pop:n=>{for(let i=0;i<Math.min(n,6);i++)tone(380+i*70+combo*30,.14,'sine',.12,0,i*.045)},
  drop:()=>tone(700,.35,'triangle',.1,120),
  swap:()=>tone(900,.05,'square',.05),
  ice:()=>tone(1500,.08,'triangle',.08,2300),
  zap:()=>{tone(1800,.15,'sawtooth',.08,200);tone(900,.2,'square',.05,150)},
  slime:()=>tone(220,.12,'sine',.1,120),
  boom:()=>tone(140,.4,'sawtooth',.2,30),
  chirp:()=>{tone(1800,.08,'sine',.1,2600);tone(2200,.1,'sine',.08,3000,.1)},
  rain:()=>[660,830,990,1320,1660].forEach((f,i)=>tone(f,.18,'sine',.1,0,i*.05)),
  earn:()=>{tone(880,.1,'triangle',.12);tone(1320,.18,'triangle',.12,0,.09)},
  level:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.14,0,i*.09)),
  over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',.08,0,i*.16))
};
function levelUp(){const par=12+level*2,st=lvShots<=par?3:lvShots<=par*1.5?2:1;lvShots=0;stats.stars+=st;if(st===3)stats.s3=1;level++;stats.maxLevel=Math.max(stats.maxLevel,level);if(pw.bird<3)pw.bird++;if(level%2===0&&pw.thunder<3){pw.thunder++;texts.push({x:W/2,y:196,t:0,s:tr('earnThunder')})}banner={t:0,s:tr('lvN',level),sub:tr('cleared','\u2605'.repeat(st)+'\u2606'.repeat(3-st))};SFX.level();vib([20,40,20,40,60])}
const par=r=>(r+off)&1, nc=r=>par(r)?COLS-1:COLS;
const px=(r,c)=>R+c*D+(par(r)?R:0), py=r=>R+r*RH;
const rnd=()=>Math.floor(rng()*(adv?CF.colors:Math.min(5,2+level)));
const iv=()=>Math.max(3,8-level);
function present(){const s=new Set();grid.forEach(r=>r.forEach(v=>{if(v>=0&&v!==5&&v!==6&&v!==7&&v<30)s.add(v>=10?v-10:v)}));return [...s]}
function pick(){const p=present();return p.length?p[Math.floor(rng()*p.length)]:rnd()}
function mkRow(r){return Array.from({length:COLS},(_,c)=>c<nc(r)?sv():-1)}
function fill(n){for(let r=0;r<n;r++)grid[r]=mkRow(r)}
function init(){lvShots=0;anim={};bird=null;bolts=[];thunders=[];flash=0;praise=null;level=1;combo=0;banner=null;shake=0;paused=false;pw={rainbow:1,bird:2,thunder:1};armed=null;trail=[];dkey=new Date().toISOString().slice(0,10).replace(/-/g,'');if(daily){level=3;rng=mb(+dkey);try{dbest=+localStorage.getItem('bbd'+dkey)||0}catch(e){dbest=0}}else rng=adv?mb(777+adv*31):Math.random;off=0;grid=Array.from({length:ROWS},()=>Array(COLS).fill(-1));if(endless)level=3;if(tmode){level=2;tl=60}fill(adv?CF.rows:6);score=0;shots=0;over=false;fall=[];pops=[];parts=[];texts=[];shot=null;cur=pick();nxt=pick();hud();document.getElementById('ov').style.display='none'}
function hud(){
  const g=id=>document.getElementById(id);g('sc').textContent=score;g('ls').textContent=tr('score');g('lb').textContent=tr('best');
  let gl='';
  if(adv){const l=Math.max(0,CF.shots-shots);g('lt').textContent=tr('shots');g('lv').textContent=l;g('bar').style.width=l/CF.shots*100+'%';g('lb').textContent=tr('level');g('bs').textContent=adv;gl=goalHtml()}
  else if(tmode){const l=Math.ceil(Math.max(0,tl));g('lt').textContent=tr('time');g('lv').textContent=l+'s';g('bar').style.width=Math.min(100,tl/60*100)+'%';g('bs').textContent=meta.tb}
  else if(endless){const p=per(),l=p-shots%p;g('lt').textContent=tr('nextRowIn');g('lv').textContent=l;g('bar').style.width=(1-l/p)*100+'%';g('bs').textContent=meta.eb}
  else if(daily){const l=Math.max(0,30-shots);g('lt').textContent=tr('shots');g('lv').textContent=l;g('bar').style.width=l/30*100+'%';g('bs').textContent=dbest}
  else{const lo=175*(level-1)*level,hi=175*level*(level+1);g('lt').textContent=tr('level');g('lv').textContent=level;g('bar').style.width=Math.min(100,Math.max(0,(score-lo)/(hi-lo)*100))+'%';g('bs').textContent=best}
  const ge=g('goal');ge.style.display=adv?'flex':'none';ge.innerHTML=gl;document.body.classList.toggle('adv',!!adv);
  cv.style.borderColor=COL[(Math.max(1,adv?CF.n:level)-1)%5].b+'77';
}
function nb(r,c){const d=par(r)?[0,1]:[-1,0],a=[[r,c-1],[r,c+1]];[r-1,r+1].forEach(y=>d.forEach(k=>a.push([y,c+k])));return a.filter(([y,x])=>y>=0&&y<ROWS&&x>=0&&x<nc(y))}
function addRow(){anim={};grid.pop();off^=1;grid.unshift(mkRow(0))}
function hit(sx=shot.x,sy=shot.y){const lim=D*D*.78;for(let r=0;r<ROWS;r++)for(let c=0;c<nc(r);c++)if(grid[r][c]>=0){const dx=px(r,c)-sx,dy=py(r)-sy;if(dx*dx+dy*dy<lim)return true}return false}
function land(){
  let br=0,bc=0,bd=1e9;const r0=Math.round((shot.y-R)/RH);
  for(let r=Math.max(0,r0-1);r<=Math.min(ROWS-1,r0+1);r++)for(let c=0;c<nc(r);c++)if(grid[r][c]<0){const dx=px(r,c)-shot.x,dy=py(r)-shot.y,d=dx*dx+dy*dy;if(d<bd){bd=d;br=r;bc=c}}
  anim[br*20+bc]=T;const kind=shot.kind;if(kind==='bird')birdStrike(px(br,bc),py(br),shot.x,shot.y);else grid[br][bc]=kind==='rainbow'?rainbowColor(br,bc):shot.c;shot=null;if(kind!=='bird')popGroup(br,bc);settle(kind)}
function settle(kind){shots++;lvShots++;tick();

 fish:(g,s,t)=>{g.fillStyle=s.col;g.globalAlpha=.55;s.list.forEach(o=>{o.x+=o.v;if(o.x>W+30)o.x=-30;if(o.x<-30)o.x=W+30;const d=o.v>0?1:-1,w=Math.sin(t*6+o.ph)*3*o.s;g.beginPath();g.ellipse(o.x,o.y,11*o.s,5*o.s,0,0,7);g.fill();g.beginPath();g.moveTo(o.x-d*9*o.s,o.y);g.lineTo(o.x-d*18*o.s,o.y-6*o.s+w);g.lineTo(o.x-d*18*o.s,o.y+6*o.s+w);g.closePath();g.fill()});g.globalAlpha=1},
 waves:(g,s,t,th)=>{const hz=th.hz;g.lineWidth=1.4;for(let k=0;k<6;k++){const y0=hz+16+k*30;g.strokeStyle='rgba(255,255,255,'+(.06+k*.018)+')';g.beginPath();for(let x=0;x<=W;x+=8){const y=y0+Math.sin(x*.03+t*(.7+k*.12)+k*1.7)*(1.5+k*.8);x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}g.fillStyle=th.a;for(let i=0;i<16;i++){const y=hz+8+i*12,w=(30-i*1.2)*(.4+.6*Math.abs(Math.sin(t*1.8+i*2.1))),cx=th.sx+Math.sin(t*.9+i)*8;g.globalAlpha=.55*Math.abs(Math.sin(t*2+i*1.3));g.fillRect(cx-w/2,y,w,1.6)}g.globalAlpha=1},
 aurora:(g,s,t,th)=>{g.save();g.globalCompositeOperation='lighter';[[th.a,0,120],[th.c,1.7,170],[th.a,3.1,220]].forEach(([col,ph,base])=>{const top=x=>base+Math.sin(x*.012+t*.35+ph)*34+Math.sin(x*.031-t*.27+ph*2)*14;const gr=g.createLinearGradient(0,base-70,0,base+190);gr.addColorStop(0,col+'00');gr.addColorStop(.35,col+'55');gr.addColorStop(1,col+'00');g.fillStyle=gr;g.beginPath();g.moveTo(0,top(0));for(let x=8;x<=W;x+=8)g.lineTo(x,top(x));g.lineTo(W,top(W)+170);for(let x=W;x>=0;x-=8)g.lineTo(x,top(x)+170+Math.sin(x*.02+t*.5)*18);g.closePath();g.fill()});g.restore()},
 dust:(g,s,t,th)=>{g.strokeStyle=th.a;g.globalAlpha=.22;g.lineWidth=1;g.beginPath();s.forEach(o=>{o.x+=o.v;if(o.x>W+30){o.x=-30;o.y=260+Math.random()*280}g.moveTo(o.x,o.y);g.lineTo(o.x+o.l,o.y)});g.stroke();g.globalAlpha=1},
 windows:(g,s,t,th)=>{g.fillStyle=th.a;s.forEach(o=>{g.globalAlpha=.2+.8*(Math.sin(t*o.sp+o.ph)>.2?1:0);g.fillRect(o.x,o.y,4,6)});g.globalAlpha=1},
 butterflies:(g,s,t)=>{s.forEach(b=>{const x=b.x+Math.sin(t*.5+b.ph)*70,y=b.y+Math.cos(t*.7+b.ph)*34,w=Math.abs(Math.sin(t*9+b.ph));g.fillStyle=b.col;g.beginPath();g.ellipse(x-4,y,5*w+1,6,-.4,0,7);g.fill();g.beginPath();g.ellipse(x+4,y,5*w+1,6,.4,0,7);g.fill()})},
 pollen:(g,s,t)=>{g.fillStyle='rgba(255,255,255,.5)';s.forEach(o=>{o.y-=o.v;o.x+=Math.sin(t+o.ph)*.3;if(o.y<-4){o.y=H+4;o.x=Math.random()*W}g.beginPath();g.arc(o.x,o.y,1.4,0,7);g.fill()})},
 ripples:(g,s,t,th)=>{if(Math.random()<.04&&s.list.length<5)s.list.push({x:40+Math.random()*280,y:th.hz+30+Math.random()*160,r:2,l:1});g.lineWidth=1.2;s.list=s.list.filter(o=>{o.r+=.6;o.l-=.014;g.strokeStyle='rgba(255,255,255,'+Math.max(0,o.l*.5)+')';g.beginPath();g.ellipse(o.x,o.y,o.r*2.4,o.r*.8,0,0,7);g.stroke();return o.l>0})}
};
function makeFx(th,i){const r=mb(i*131+7),names=[...FXS[th.sc]];if(lum(th.t)<85&&!names.includes('stars')&&th.sc!=='under'&&th.sc!=='rain')names.unshift('stars');return names.map(n=>({n,s:FI[n](r,th)}))}
function useTheme(i,force){
  i=SK[i]?i:0;setBg(SK[i].v);if(i===bgi&&!force)return;bgi=i;const th=SK[i].th;
  bgS=document.createElement('canvas');bgS.width=W*DPR;bgS.height=H*DPR;const g=bgS.getContext('2d');g.scale(DPR,DPR);
  paintStatic(g,th,i);bgFx=makeFx(th,i);drawBg(0);
}
function drawBg(t){if(!bgS)return;bgx.drawImage(bgS,0,0,W,H);if(!reduceMotion){const th=SK[bgi].th;bgFx.forEach(f=>FD[f.n](bgx,f.s,t,th))}}
const THUMB={};
function thumb(i,w,h){
  const key=i+'_'+w;if(THUMB[key])return THUMB[key];
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.scale(w/W,h/H);
  paintStatic(g,SK[i].th,i);
  SK[i].c.forEach((col,k)=>{const x=60+k*60,y=470,r=18,gr=g.createRadialGradient(x-6,y-7,2,x,y,r);gr.addColorStop(0,mix(col,255,.55));gr.addColorStop(.55,col);gr.addColorStop(1,mix(col,0,.4));g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()});
  let url='';try{url=c.toDataURL('image/jpeg',.82)}catch(e){}
  return THUMB[key]=url;
}
const TPP=8;
function themesView(back,pg){
  if(typeof pg!=='number')pg=Math.floor(set.skin/TPP);
  const pages=Math.ceil(SK.length/TPP);pg=Math.max(0,Math.min(pages-1,pg));tvBack=back;tvPg=pg;
  const a=pg*TPP,z=Math.min(SK.length,a+TPP),cards=[],have=SK.filter((k,i)=>skOwn(i)).length;
  for(let i=a;i<z;i++){const own=skOwn(i),eq=set.skin===i;cards.push('<button class="tcard'+(eq?' eq':'')+'" onclick="themeDetail('+i+')"><img src="'+thumb(i,120,187)+'" alt=""><span>'+SK[i].n+'</span><small>'+(eq?tr('equipped'):'')+'</small></button>')}
  show(tr('themes'),'<div class="pg"><button '+(pg?'':'disabled')+' onclick="themesView(tvBack,'+(pg-1)+')">\u2039</button><span>'+(pg+1)+' / '+pages+' \u00b7 '+have+'/'+SK.length+'</span><button '+(pg<pages-1?'':'disabled')+' onclick="themesView(tvBack,'+(pg+1)+')">\u203a</button></div><div class="tg">'+cards.join('')+'</div>',[[tr('back'),back]]);
}
function themeDetail(i){
  const own=skOwn(i),eq=set.skin===i,tok=++pvTok,leave=()=>{useTheme(set.skin);themesView(tvBack,tvPg)};
  const act=eq?[]:own?[[tr('equip'),()=>{set.skin=i;saveSet();applySkin(i);themesView(tvBack,tvPg)}]]:[[tr('buy')+' '+SK[i].p,()=>{if(meta.coins<SK[i].p){toast(tr('noCoins'));SFX.stick();return}meta.coins-=SK[i].p;meta.own['t'+i]=1;meta.bought=(meta.bought||0)+1;SFX.earn();set.skin=i;saveSet();saveMeta();applySkin(i);chk();themesView(tvBack,tvPg)}]];
  useTheme(i);
  show(SK[i].n,'<img class="thimg" src="'+thumb(i,180,280)+'" alt=""><div class="coinline">'+(eq?tr('equipped'):own?tr('owned'):'<i class="coin"></i>'+SK[i].p)+'</div>',[...act,[tr('preview'),()=>{document.getElementById('ov').style.display='none';setTimeout(()=>{if(tok===pvTok)themeDetail(i)},3800)}],[tr('back'),leave]]);
}
window.bgReady=1;useTheme(set.skin);
function toMenu(){over=true;paused=false;bird=null;shot=null;adv=null;CF=null;daily=false;endless=false;tmode=false;hud();menu()}
// ----- rewarded ads (Thunder) -----
// Rules: optional, reward only after the ad is fully watched, max AD_MAX per day, AD_GAP between ads.
// Android wrapper sets window.NativeRewarded=(onReward,onFail)=>{...AdMob...}; in a browser a test ad is simulated.
const AD_MAX=5,AD_GAP=120000;
function adState(){const d=new Date().toLocaleDateString('en-CA');if(!meta.ad||meta.ad.d!==d)meta.ad={d,n:0,t:(meta.ad&&meta.ad.t)||0};return meta.ad}
function adLeft(){return AD_MAX-adState().n}
function adShow(ok,fail){
  if(typeof window.NativeRewarded==='function'){try{window.NativeRewarded(ok,fail)}catch(e){fail()}return}
  const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:99999;background:#0b0b1c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font:600 16px Sora,system-ui,sans-serif;text-align:center;padding:24px';
  let n=5,done=false;d.innerHTML='<div style="opacity:.6;font-size:12px">TEST AD (AdMob rewarded ad shows here)</div><div id="adn" style="font-size:44px">5</div><button id="adc" style="padding:12px 22px;border-radius:12px;border:0;font:700 15px Sora,system-ui;background:#444;color:#fff">Close</button>';
  document.body.appendChild(d);const nEl=d.querySelector('#adn'),b=d.querySelector('#adc');
  const iv=setInterval(()=>{n--;nEl.textContent=n>0?n:'\u2713';if(n<=0){clearInterval(iv);done=true;b.textContent='Claim reward';b.style.background='#2ee6a6';b.style.color='#04120d'}},1000);
  b.onclick=()=>{clearInterval(iv);d.remove();done?ok():fail()};
}
function thunderGrant(){const st=adState();st.n++;st.t=Date.now();saveMeta();pw.thunder=Math.min(3,pw.thunder+1);resume();armed='thunder';SFX.earn();texts.push({x:W/2,y:196,t:0,s:tr('earnThunder')})}
function thunderOffer(){
  if(over||paused||shot||bird)return;paused=true;armed=null;
  const st=adState(),left=AD_MAX-st.n,wait=Math.max(0,Math.ceil((AD_GAP-(Date.now()-st.t))/1000)),later=[tr('later'),resume];
  if(left<=0)show(tr('thOfferT'),tr('adDone'),[later]);
  else if(wait>0)show(tr('thOfferT'),tr('adWait',wait),[later]);
  else show(tr('thOfferT'),tr('adOffer',left),[[tr('watchAd'),()=>adShow(thunderGrant,()=>{toast(tr('adFail'));resume()})],later]);
}
function pause(){if(over||paused)return;paused=true;const m=()=>show(tr('paused'),tr('pausedMsg'),[[tr('resume'),resume],[tr('restart'),restart],[tr('settings'),()=>settings(m)],[tr('mainMenu'),toMenu]]);m()}
function resume(){paused=false;document.getElementById('ov').style.display='none'}
document.addEventListener('keydown',e=>{if(e.key==='p'||e.key==='Escape')paused?resume():pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function loop(ts){T++;const dt=Math.min(.05,((ts||0)-lastT)/1000)||0;lastT=ts||0;if(!paused){step();if(tmode&&!over&&!bird){const pi=Math.ceil(tl);tl-=dt;if(tl<=0){tl=0;hud();end(false)}else if(Math.ceil(tl)!==pi)hud()}}if(T%2===0)drawBg(T/60);draw();requestAnimationFrame(loop)}
function pt(e){const b=cv.getBoundingClientRect();return [(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]}
function aim(e){
  const [x,y]=pt(e);let a=Math.atan2(y-SY,x-W/2);
  if(a>0)a=x<W/2?-Math.PI+.17:-.17;
  ang=Math.max(-Math.PI+.17,Math.min(-.17,a));
}
function fire(){if(over||shot||paused||bird)return;if(armed==='thunder'){armed=null;pw.thunder--;thunderStrike();return}SFX.shoot();shot={x:W/2,y:SY,vx:Math.cos(ang)*16,vy:Math.sin(ang)*16,c:cur,kind:armed};if(armed){pw[armed]--;armed=null}}
cv.addEventListener('pointerdown',e=>{const [x,y]=pt(e);if(!over&&!shot)for(const [sx,k] of [[108,'rainbow'],[252,'bird'],[324,'thunder']])if(Math.hypot(x-sx,y-SY-6)<26){if(pw[k]>0){armed=armed===k?null:k;SFX.swap()}else if(k==='thunder')thunderOffer();ignore=true;return}if(!over&&!shot&&x<76&&y>SY-24){[cur,nxt]=[nxt,cur];SFX.swap();ignore=true;return}aim(e)});
cv.addEventListener('pointermove',e=>{if(!ignore)aim(e)});
cv.addEventListener('pointerup',e=>{if(ignore){ignore=false;return}aim(e);fire()});
document.getElementById('pz').innerHTML=PZ;document.getElementById('pz').onclick=pause;
document.getElementById('mute').onclick=()=>{muted=!muted;try{localStorage.setItem('bbm',muted?'1':'0')}catch(e){}setMute();musicSync();if(!muted){ac();SFX.swap()}};
setMute();
init();over=true;boot();loop();
</script>
